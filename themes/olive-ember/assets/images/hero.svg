<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-hidden="true">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#1D5866"/>
			<stop offset=".55" stop-color="#C98A5A"/>
			<stop offset="1" stop-color="#F2C27A"/>
		</linearGradient>
		<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2C6E7A"/>
			<stop offset="1" stop-color="#173F4A"/>
		</linearGradient>
		<radialGradient id="glow" cx=".5" cy=".5" r=".5">
			<stop offset="0" stop-color="#FFD58A" stop-opacity=".95"/>
			<stop offset=".35" stop-color="#E3A23A" stop-opacity=".55"/>
			<stop offset="1" stop-color="#C2461F" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="arch">
			<path d="M60 640V250a200 200 0 0 1 400 0v390z"/>
		</clipPath>
	</defs>

	<!-- Limestone frame -->
	<path d="M20 640V250a240 240 0 0 1 480 0v390z" fill="#E4DDCF"/>

	<g clip-path="url(#arch)">
		<rect width="520" height="640" fill="url(#sky)"/>
		<circle class="oe-hero-sun" cx="330" cy="330" r="150" fill="url(#glow)"/>
		<circle cx="330" cy="330" r="40" fill="#F7D394"/>
		<!-- Hill and basilica -->
		<path d="M60 430c40-30 70-52 112-60 30-6 52-30 70-62h10c14 30 40 46 76 58 40 13 90 30 132 64v40H60z" fill="#3B4A3A"/>
		<rect x="240" y="270" width="16" height="44" fill="#3B4A3A"/>
		<path d="M236 274h24l-12-26z" fill="#3B4A3A"/>
		<circle cx="248" cy="246" r="4" fill="#E3A23A"/>
		<!-- Sea -->
		<rect x="0" y="440" width="520" height="200" fill="url(#sea)"/>
		<g stroke="#F7D394" stroke-linecap="round" opacity=".7">
			<path d="M250 466h100" stroke-width="5"/>
			<path d="M226 492h150" stroke-width="4" opacity=".7"/>
			<path d="M262 520h80" stroke-width="4" opacity=".5"/>
			<path d="M120 476h40M400 500h36" stroke-width="3" opacity=".4"/>
		</g>
		<!-- Pointu boat -->
		<path d="M128 560h108l-14 18h-82z" fill="#F2EEE6"/>
		<path d="M128 560h108" stroke="#C2461F" stroke-width="5"/>
		<path d="M180 560v-58l34 44z" fill="#F2EEE6" opacity=".9"/>
	</g>

	<!-- Olive branch in front of the arch -->
	<g class="oe-hero-branch" fill="#5D6A35">
		<path d="M520 120C430 170 360 250 300 360" fill="none" stroke="#4A5040" stroke-width="6" stroke-linecap="round"/>
		<ellipse cx="468" cy="140" rx="34" ry="11" transform="rotate(-38 468 140)"/>
		<ellipse cx="440" cy="186" rx="36" ry="11" transform="rotate(32 440 186)" fill="#7C8A4B"/>
		<ellipse cx="404" cy="200" rx="34" ry="10" transform="rotate(-52 404 200)"/>
		<ellipse cx="380" cy="252" rx="36" ry="11" transform="rotate(24 380 252)" fill="#7C8A4B"/>
		<ellipse cx="344" cy="272" rx="32" ry="10" transform="rotate(-60 344 272)"/>
		<ellipse cx="330" cy="322" rx="30" ry="9" transform="rotate(14 330 322)" fill="#7C8A4B"/>
		<ellipse cx="420" cy="214" rx="11" ry="15" fill="#1F241A"/>
		<ellipse cx="362" cy="292" rx="10" ry="14" fill="#2F3826"/>
	</g>
</svg>
